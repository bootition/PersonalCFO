# 微信账单 → hledger journal 规则（初版，基于真实账单统计迭代）
#
# 使用：
#   double-entry-generator.exe translate -p wechat -t ledger --config config/wechat.yaml <账单xlsx|csv> -o journals/import-wechat.journal

defaultMinusAccount: Assets:FIXME
defaultPlusAccount: Expenses:FIXME
defaultCommissionAccount: Expenses:其他
defaultCurrency: CNY
title: MRQ个人账本

wechat:
  rules:
    # ── 支付方式 ──
    - method: 零钱
      fullMatch: true
      methodAccount: Assets:现金:微信
    - method: 零钱通
      methodAccount: Assets:现金:零钱通
    - method: 建设银行储蓄卡
      methodAccount: Assets:银行存款:建设银行
    - method: 招商银行储蓄卡
      methodAccount: Assets:银行存款:招商银行
    - method: 光大银行储蓄卡
      methodAccount: Assets:银行存款:光大银行
    - method: 工商银行储蓄卡
      methodAccount: Assets:银行存款:工商银行

    # ── 资金流（零钱通/提现/充值）──
    - txType: 转入零钱通
      targetAccount: Assets:现金:零钱通
    - txType: 零钱通转出
      targetAccount: Assets:现金:微信
    - txType: 零钱提现
      targetAccount: Assets:银行存款:建设银行
    - txType: 零钱充值
      targetAccount: Assets:现金:微信
    - txType: 购买理财通
      targetAccount: Assets:投资:基金
    - txType: 理财通赎回
      targetAccount: Assets:现金:零钱通

    # ── 收入 ──
    - type: 收入
      txType: 微信红包
      targetAccount: Income:其他收入
    - type: 收入
      targetAccount: Income:其他收入

    # ── 支出分类（按交易对方/商品细化）──
    - peer: 美团平台商户
      targetAccount: Expenses:日常三餐
    - peer: 拼多多平台商户
      targetAccount: Expenses:日常娱乐
    - peer: 京东
      targetAccount: Expenses:日常娱乐
    - peer: 孔夫子旧书网
      targetAccount: Expenses:书籍学习
    - peer: 地铁
      targetAccount: Expenses:出行交通
    - peer: 公交
      targetAccount: Expenses:出行交通
    - txType: 商户消费
      targetAccount: Expenses:FIXME

    # ── 转账 / 退款：人际转账保持 FIXME 人工定性；退款由 deg 自动反向匹配 ──
    - txType: 转账
      targetAccount: Assets:FIXME

    # ── 兜底 ──
    - targetAccount: Expenses:FIXME
