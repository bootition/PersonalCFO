# 支付宝账单 → hledger journal 规则
#
# 使用：
#   double-entry-generator.exe translate -p alipay -t ledger --config config/alipay.yaml <账单csv> -o journals/import-alipay.journal
#
# deg 规则引擎语义（2026-09-06 读源码 pkg/analyser/alipay/alipay.go + pkg/provider/alipay/alipay.go，并实测确认）：
#   1. 规则按顺序逐条评估；规则内多条件 AND；匹配为"包含"（fullMatch 为精确）。
#      命中即赋值，后命中覆盖先命中（同侧）——宽规则在前、具体规则在后；
#      严禁"无条件兜底规则"（匹配一切并覆盖一切，默认值机制已兜底）。
#   2. targetAccount：支出/不计收支 → 借方(plus)；收入 → 贷方来源(minus，即 Income 科目)。
#      methodAccount：支出/不计收支 → 贷方(minus)；收入 → 借方(plus)。
#   3. 退款（item 前缀"退款-"/category=退款/status=退款成功）自动交换借贷两侧；
#      status=退款成功 且 category=退款 且能找到原始订单（单号前缀+等额）→ 原单与退款双双剔除；
#      status=交易关闭 且 type=不计收支 → 自动剔除；其余关闭/撤销靠 L0 ignore 规则。
#   4. 未命中：defaultMinusAccount / defaultPlusAccount（FIXME = 待确认队列，设计特性）。
#
# 分层顺序（后层覆盖前层）：
#   L0 状态丢弃 → L1 宽 type → L2 交易分类 → L3 具体 item/peer（含收入侧 methodAccount 补全）
#   → L4 蚂蚁财富买入"支付方式缺失"猜测 → L5 权威支付方式 → L6 支付方式矫正（余额宝转出方向修复）

defaultMinusAccount: Assets:FIXME
defaultPlusAccount: Expenses:FIXME
defaultCurrency: CNY
title: MRQ个人账本

alipay:
  rules:
    # ══ L0 状态丢弃（ignore 命中即终止匹配）══
    - status: 已撤销
      ignore: true
    - status: 交易关闭
      ignore: true

    # ══ L1 宽 type 规则 ══
    - type: 不计收支
      targetAccount: Assets:FIXME
    - type: 收入
      targetAccount: Income:其他收入

    # ══ L2 交易分类 ══
    - category: 餐饮美食
      targetAccount: Expenses:日常三餐
    - category: 交通出行
      targetAccount: Expenses:出行交通
    - category: 教育培训
      targetAccount: Expenses:书籍学习
    - category: 图书影音
      targetAccount: Expenses:书籍学习
    - category: 医疗健康
      targetAccount: Expenses:医疗健康
    - category: 充值缴费
      targetAccount: Expenses:日常缴费
    - category: 生活服务
      targetAccount: Expenses:日常缴费
    - category: 保险
      targetAccount: Expenses:日常缴费
    - category: 公共服务
      targetAccount: Expenses:日常缴费
    - category: 酒店旅游
      targetAccount: Expenses:旅游
    - category: 文化休闲
      targetAccount: Expenses:日常娱乐
    - category: 美容美发
      targetAccount: Expenses:日常娱乐
    - category: 服饰装扮
      targetAccount: Expenses:衣物用品
    - category: 日用百货
      targetAccount: Expenses:衣物用品
    - category: 数码电器
      targetAccount: Expenses:衣物用品
    - category: 家居家装
      targetAccount: Expenses:衣物用品
    - category: 运动户外
      targetAccount: Expenses:锻炼花费
    - category: 爱车养车
      targetAccount: Expenses:出行交通
    - category: 宠物
      targetAccount: Expenses:其他
    - category: 商业服务
      targetAccount: Expenses:其他
    - category: 其他
      targetAccount: Expenses:其他
    # 亲友代付/亲情卡 = 副业成本（沿用上项目用户裁决口径）
    - category: 亲友代付
      targetAccount: Expenses:副业成本
    # 投资理财默认 = 基金买卖（资产转换，不是费用）；收益/卖出由 L3/L6 细化
    - category: 投资理财
      targetAccount: Assets:投资:基金
    # 转账红包：方向/对象需人工定性（人情/借出/自转），保持 FIXME
    - category: 转账红包
      targetAccount: Assets:FIXME

    # ══ L3 具体 item/peer ══
    - category: 投资理财
      item: 收益发放
      targetAccount: Income:利息收入
    - type: 不计收支
      item: 余额宝-单次转入
      targetAccount: Assets:现金:余额宝
    # 花呗还款（主动/自动）：借 花呗负债 / 贷 支付方式
    - category: 信用借还
      item: 还款
      targetAccount: Liabilities:花呗
    # BUFF 饰品：现金流进出都记投资科目（Wealthfolio 子账本记逐笔，季度公允价值调整兜底）
    - peer: 网易BUFF
      targetAccount: Assets:投资:CS饰品
    - type: 收入
      peer: 网易BUFF
      targetAccount: Assets:投资:CS饰品
      methodAccount: Assets:现金:支付宝   # BUFF 收入到账余额（支付方式缺失时补全）
    # 副业：云账户灵活用工 + 闲鱼卖电子资料（item 关键词，收入方向限定防误伤）
    - peer: 云账户
      targetAccount: Income:副业收入
    - type: 收入
      peer: 云账户
      targetAccount: Income:副业收入
      methodAccount: Assets:现金:支付宝
    - type: 收入
      item: 合集
      targetAccount: Income:副业收入
      methodAccount: Assets:现金:支付宝
    - type: 收入
      item: PDF
      targetAccount: Income:副业收入
      methodAccount: Assets:现金:支付宝
    - type: 收入
      item: EPUB
      targetAccount: Income:副业收入
      methodAccount: Assets:现金:支付宝
    - type: 收入
      item: 电子版
      targetAccount: Income:副业收入
      methodAccount: Assets:现金:支付宝
    - type: 收入
      item: 课程打包
      targetAccount: Income:副业收入
      methodAccount: Assets:现金:支付宝
    # 闲鱼币服务费 = 副业成本
    - item: 闲鱼币
      targetAccount: Expenses:副业成本
    # 支付宝分类失真矫正（实测：教育培训下全是食堂餐费；生活服务下大量美团骑行）
    - item: 餐费支出
      targetAccount: Expenses:日常三餐
    - item: 一卡通充值
      targetAccount: Expenses:日常三餐
    - item: 美团骑行
      targetAccount: Expenses:出行交通
    - item: 华莱士
      targetAccount: Expenses:日常三餐
    - item: 汉堡王
      targetAccount: Expenses:日常三餐
    # 闲鱼销售分账服务费 = 副业成本
    - item: 分账-
      targetAccount: Expenses:副业成本
    # 具体商户/对象
    - peer: linserf
      item: 电费
      targetAccount: Expenses:日常缴费
    - peer: 百度网盘
      targetAccount: Expenses:日常娱乐
    - peer: 阿奇索
      targetAccount: Expenses:日常娱乐
    - peer: 问问大象
      targetAccount: Expenses:书籍学习

    # ══ L4 蚂蚁财富买入：支付方式缺失时按余额宝扣款（L5 真实支付方式会覆盖本层）══
    - peer: 蚂蚁财富
      item: 买入
      targetAccount: Assets:投资:基金
      methodAccount: Assets:现金:余额宝

    # ══ L5 权威支付方式（支出→贷方/收入→借方）══
    - method: 账户余额
      fullMatch: true
      methodAccount: Assets:现金:支付宝
    - method: 余额
      fullMatch: true
      methodAccount: Assets:现金:支付宝
    - method: 账户余额&
      methodAccount: Assets:现金:支付宝   # 余额+立减券组合：券额并入（无法拆）
    - method: 余额宝
      methodAccount: Assets:现金:余额宝
    - method: 建设银行储蓄卡
      methodAccount: Assets:银行存款:建设银行
    - method: 工商银行储蓄卡
      methodAccount: Assets:银行存款:工商银行
    - method: 招商银行储蓄卡
      methodAccount: Assets:银行存款:招商银行
    - method: 光大银行储蓄卡
      methodAccount: Assets:银行存款:光大银行
    # 花呗在方法组最后：组合支付（余额宝&花呗、储蓄卡&花呗、花呗&红包）整笔先记花呗负债，
    # 再由 split_huabei.py 按花呗账单 PDF 精确拆分
    - method: 花呗
      methodAccount: Liabilities:花呗
    # "余额宝&花呗金"（还花呗）会被上一条 花呗 误命中，花呗金矫正回余额宝
    - method: 花呗金
      methodAccount: Assets:现金:余额宝

    # ══ L6 支付方式矫正：余额宝主动转出方向修复（必须晚于 L5）══
    # 余额宝-单次转出/转出到余额 = 余额宝→支付宝余额
    - item: 余额宝-单次转出
      targetAccount: Assets:现金:支付宝
      methodAccount: Assets:现金:余额宝
    - item: 余额宝-转出到余额
      targetAccount: Assets:现金:支付宝
      methodAccount: Assets:现金:余额宝
    # 余额宝-转出到银行卡：CSV 的"收/付款方式"是**目的地银行卡**（流入方），
    # 须强制 借=对应银行 / 贷=余额宝；按银行逐条（兜底 FIXME 在前，具体在后）
    - item: 余额宝-转出到银行卡
      targetAccount: Assets:FIXME
      methodAccount: Assets:现金:余额宝
    - item: 余额宝-转出到银行卡
      method: 建设银行储蓄卡
      targetAccount: Assets:银行存款:建设银行
      methodAccount: Assets:现金:余额宝
    - item: 余额宝-转出到银行卡
      method: 工商银行储蓄卡
      targetAccount: Assets:银行存款:工商银行
      methodAccount: Assets:现金:余额宝
    - item: 余额宝-转出到银行卡
      method: 招商银行储蓄卡
      targetAccount: Assets:银行存款:招商银行
      methodAccount: Assets:现金:余额宝
    - item: 余额宝-转出到银行卡
      method: 光大银行储蓄卡
      targetAccount: Assets:银行存款:光大银行
      methodAccount: Assets:现金:余额宝
    # 货币基金收益发放（不计收支）：方向矫正为 借 余额宝 / 贷 利息收入
    # （红队 R3：不计收支下 targetAccount 落借方，L3 利息收入规则会把此类记反）
    - type: 不计收支
      item: 收益发放
      targetAccount: Assets:现金:余额宝
      methodAccount: Income:利息收入
    # 基金卖出/转出至余额宝 = 借 余额宝 / 贷 投资:基金
    - item: 卖出至余额宝
      targetAccount: Assets:现金:余额宝
      methodAccount: Assets:投资:基金
    - item: 转出至余额宝
      targetAccount: Assets:现金:余额宝
      methodAccount: Assets:投资:基金
